<div class="dashboard-container">
    <!-- Seller Sidebar Navigation -->
    <aside class="dashboard-sidebar">
        <div class="brand-logo" style="margin-bottom: 1.5rem; padding: 0 0.5rem;">
            <div class="logo-icon"><i class="fa-solid fa-store"></i></div>
            <span>Seller<span class="accent">Hub</span></span>
        </div>
        <ul class="sidebar-menu">
            <li id="saleAndEarnings" class="sidebar-item"><a href=""><i class="fa-solid fa-chart-line"></i> Sales & Earnings</a></li>
            <li id="manageProducts" class="sidebar-item active"><a href=""><i class="fa-solid fa-box-open"></i> Manage Products</a></li>
            <li id="customerReviews" class="sidebar-item"><a href=""><i class="fa-solid fa-star-half-stroke"></i> Customer Reviews</a></li>
            <li id="profileAndAddress" class="sidebar-item"><a href=""><i class="fa-solid fa-id-card"></i> Profile & Address</a></li>
        </ul>
    </aside>

    <!-- Main Seller Panel -->
    <main class="dashboard-main-content">
        <div class="section-header">
            <div>
                <h1 class="section-title"><i class="fa-solid fa-box-open" style="color: var(--c-orange);"></i> Manage Products</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Add, update, and manage your product catalog</p>
            </div>
        </div>

        <!-- ==================================================================== -->
        <!-- All Products (grouped by category, paginated — 4 columns x 2 rows = 8 per page) -->
        <!-- ==================================================================== -->
        <div class="data-table-card" style="margin-bottom: 2rem;">
            <div class="section-header" style="margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem;">
                <h3 style="font-size: 1.1rem; font-weight: 800;"><i class="fa-solid fa-grip" style="color: var(--c-primary-dark); margin-right: 0.4rem;"></i>All Products</h3>
                <div class="section-toolbar">
                    <div class="input-with-icon toolbar-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="productsSearchInput" placeholder="Type product name">
                    </div>
                    <button type="button" class="refresh-btn" id="productsRefreshBtn" title="Refresh products">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>

                    <div class="input-with-icon" style="min-width: 190px; max-width: 300px;">
                        <i class="fa-solid fa-filter"></i>
                        <select id="productCategoryFilter">

                        </select>
                    </div>
                </div>
            </div>

            <div class="category-cards-grid products-page-grid" id="productsGrid" data-current-page="1">


            </div>

            <!-- Pagination controls: your JS reads data-target to know which grid to page -->
            <div class="pagination-controls" id="productsPagination" data-target="productsGrid">
                <button type="button" class="pagination-arrow-btn" id="productsPrevBtn" disabled aria-label="Previous page">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div id="productsPageNumbers" class="pagination-pill">
                    <span class="pagination-page active" data-page="1">1</span>
                </div>
                <button type="button" class="pagination-arrow-btn" id="productsNextBtn" aria-label="Next page">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- ==================================================================== -->
        <!-- Low Stock Products (paginated — 4 columns x 2 rows = 8 per page) -->
        <!-- ==================================================================== -->
        <div class="data-table-card">
            <div class="section-header" style="margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem;">
                <h3 style="font-size: 1.1rem; font-weight: 800;">
                    <i class="fa-solid fa-triangle-exclamation" style="color: var(--c-orange); margin-right: 0.4rem;"></i>Low Stock Products
                </h3>
            </div>

            <div class="category-cards-grid products-page-grid" id="lowStockProductsGrid" data-current-page="1">

            </div>

        </div>

        <!-- ==================================================================== -->
        <!-- Add / Update Product Form (hidden by default — toggle display:none/block from JS) -->
        <!-- ==================================================================== -->
        <div class="data-table-card" id="productFormCard" style="margin-top: 2rem">
            <div class="section-header" style="margin-bottom: 1.25rem;">
                <h3 style="font-size: 1.1rem; font-weight: 800;" id="productFormTitle">
                    <i class="fa-solid fa-square-plus" style="color: var(--c-primary-dark); margin-right: 0.4rem;"></i>Add New Product
                </h3>
            </div>

            <form id="productForm" class="auth-form">

                <!-- Category Selection -->
                <div class="form-group">
                    <label for="productFormCategory">Category</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-layer-group"></i>
                        <select id="productFormCategory" name="categoryId" required>

                        </select>
                    </div>
                </div>

                <div class="form-grid-2col">
                    <!-- Product ID (auto-generated, read-only) -->
                    <div class="form-group">
                        <label for="productFormId">Product ID</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-hashtag"></i>
                            <input type="text" id="productFormId" name="productId" placeholder="Auto-generated" readonly>
                        </div>
                    </div>

                    <!-- Product Name -->
                    <div class="form-group">
                        <label for="productFormName">Product Name</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-tag"></i>
                            <input type="text" id="productFormName" name="productName" placeholder="e.g. Rayvora SonicPro Headphones" required>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="productFormDescription">Description</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-align-left" style="align-self: flex-start; margin-top: 0.9rem;"></i>
                        <textarea id="productFormDescription" name="description" placeholder="Short description of this product"></textarea>
                    </div>
                </div>

                <div class="form-grid-2col">
                    <!-- Unit Price -->
                    <div class="form-group">
                        <label for="productFormPrice">Unit Price (LKR)</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-sack-dollar"></i>
                            <input type="number" id="productFormPrice" name="unitPrice" placeholder="e.g. 26990" min="0" step="0.01" required>
                        </div>
                    </div>

                    <!-- Brand -->
                    <div class="form-group">
                        <label for="productFormBrand">Brand</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-copyright"></i>
                            <input type="text" id="productFormBrand" name="brand" placeholder="e.g. Rayvora" required>
                        </div>
                    </div>
                </div>

                <div class="form-grid-2col">
                    <!-- Quantity -->
                    <div class="form-group">
                        <label for="productFormQuantity">Quantity</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-boxes-stacked"></i>
                            <input type="number" id="productFormQuantity" name="quantity" placeholder="e.g. 42" min="0" required>
                        </div>
                    </div>

                    <!-- Low Stock Limit -->
                    <div class="form-group">
                        <label for="productFormLowStockLimit">Low Stock Limit</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <input type="number" id="productFormLowStockLimit" name="lowStockLimit" placeholder="e.g. 10" min="0" required>
                        </div>
                    </div>
                </div>

                <!-- Product Images (multiple) -->
                <div class="form-group">
                    <label for="productImagesInput">Product Images</label>
                    <label class="file-upload-box" for="productImagesInput" id="productImagesUploadLabel">
                        <input type="file" id="productImagesInput" name="productImages" accept="image/*" multiple hidden>
                        <div class="file-upload-placeholder" id="productImagesPlaceholder">
                            <i class="fa-solid fa-images"></i>
                            <span>Click to upload product images</span>
                            <small>PNG or JPG, up to 5MB each — select multiple images</small>
                        </div>
                    </label>

                    <!-- Uploaded images preview (primary-image selector removed — first image uploaded is used as the listing thumbnail) -->
                    <div id="productImagesPreviewGrid" style="display: flex; flex-wrap: wrap; gap: 0.85rem; margin-top: 0.85rem;">

                    </div>
                </div>

                <div style="display: flex; gap: 0.75rem;">
                    <button type="button" class="btn btn-primary btn-block" id="btnSubmitProduct">
                        Save Product
                    </button>
                    <button type="button" class="btn btn-outline btn-block" id="btnCancelProductForm">
                        Cancel
                    </button>
                </div>
            </form>

            <p id="productFormError" class="auth-error-msg"></p>
        </div>
    </main>
</div>
