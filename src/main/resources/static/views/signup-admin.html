<div class="auth-wrapper">
    <div class="signup-container" id="adminSignupCard" style="max-width: 600px;">
        <div class="auth-header">
            <div style="width: 50px; height: 50px; background: rgba(159, 161, 255, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem;">
                <i class="fa-solid fa-user-shield" style="font-size: 1.5rem; color: var(--c-primary-dark);"></i>
            </div>
            <h1>Register New Admin</h1>
            <p>Grant administrator privileges for system telemetry, management & oversight</p>
        </div>

        <form id="adminSignupForm" class="auth-form">
            <!-- First Name & Last Name -->
            <div class="form-grid-2col">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input 
                            type="text" 
                            id="firstName" 
                            name="firstName"
                            placeholder="Admin" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input 
                            type="text" 
                            id="lastName" 
                            name="lastName"
                            placeholder="User" 
                            required
                        >
                    </div>
                </div>
            </div>

            <!-- Email & Contact Number -->
            <div class="form-grid-2col">
                <div class="form-group">
                    <label for="email">Admin Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="admin@rayvora.com" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-phone"></i>
                        <input 
                            type="tel" 
                            id="contact" 
                            name="contact"
                            placeholder="+1 (555) 123-4567" 
                            required
                        >
                    </div>
                </div>
            </div>

            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-at"></i>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        placeholder="admin_master" 
                        required
                    >
                </div>
            </div>

            <!-- Password & Confirm Password -->
            <div class="form-grid-2col">
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="••••••••••••" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-shield-halved"></i>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword"
                            placeholder="••••••••••••" 
                            required
                        >
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btnSubmitAdminSignup">
                <i class="fa-solid fa-user-shield"></i> Register Administrator
            </button>
        </form>

        <p id="adminSignupError" class="auth-error-msg"></p>

        <div class="auth-footer">
            <p>Return to <a href="views/admin-dashboard.html">Admin Operations Dashboard</a></p>
        </div>
    </div>
</div>
