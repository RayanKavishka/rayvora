<div class="auth-wrapper">
    <div class="signup-container" id="customerSignupCard" style="max-width: 600px;">
        <div class="auth-header">
            <h1>Create Customer Account</h1>
            <p>Join Rayvora today for exclusive discounts & fast checkout</p>
        </div>

        <form id="customerSignupForm" class="auth-form">
            <!-- Name Row: First Name & Last Name -->
            <div class="form-grid-2col">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input 
                            type="text" 
                            id="firstName" 
                            name="firstName"
                            placeholder="John" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input 
                            type="text" 
                            id="lastName" 
                            name="lastName"
                            placeholder="Doe" 
                            required
                        >
                    </div>
                </div>
            </div>

            <!-- Email & Contact Row -->
            <div class="form-grid-2col">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="john.doe@example.com" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-phone"></i>
                        <input 
                            type="tel" 
                            id="contact" 
                            name="contact"
                            placeholder="+1 (555) 000-1234" 
                            required
                        >
                    </div>
                </div>
            </div>

            <!-- Username Row -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-at"></i>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        placeholder="johndoe99" 
                        required
                    >
                </div>
            </div>

            <!-- Password & Confirm Password Row -->
            <div class="form-grid-2col">
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="••••••••••••" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-shield-halved"></i>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword"
                            placeholder="••••••••••••" 
                            required
                        >
                    </div>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="acceptTerms" required>
                    <span>I agree to the <a href="#terms" style="color: var(--c-primary-dark);">Terms & Conditions</a></span>
                </label>
            </div>

            <button type="button" class="btn btn-orange btn-block" id="btnSubmitCustomerSignup">
                <i class="fa-solid fa-user-plus"></i> Create Customer Account
            </button>
        </form>

        <p id="customerSignupError" class="auth-error-msg"></p>

        <div class="auth-footer">
            <p>Already have an account? <button id="linkToLogin" style="color: var(--c-orange); background: transparent">Sign In</button></p>
        </div>
    </div>
</div>
